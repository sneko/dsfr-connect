name: Continuous Integration
on:
  push:
    branches:
      - main
      - dev
  pull_request:
env:
  APP_NAME: dsfr-connect
  CONTAINER_REGISTRY: ghcr.io
  CONTAINER_IMAGE_FOLDER: ghcr.io/${{ github.repository }}
  NODE_OPTIONS: --max_old_space_size=4096
  NODE_VERSION: 18.16.0
  PNPM_VERSION: 8.6.1
concurrency:
  # Prevent parallel builds of the same branch
  group: cicd-${{ github.ref }}
  cancel-in-progress: false
jobs:
  requirements:
    name: Continuous Integration
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: pnpm/action-setup@v2
        name: Install pnpm
        id: pnpm-install
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Export pnpm store directory as an environment variable
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_ENV

      - uses: actions/cache@v3
        name: Setup pnpm cache
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: make deps

      - name: Lint
        run: make lint

      - name: Format check
        run: make format-check

      - name: Test unit
        run: make test-unit

      - uses: actions/cache@v3
        name: Setup assets cache
        with:
          path: apps/docs/tmp/
          # The `raw` DSFR is scrapped with a fixed URL so you have to delete the CI/CD cache if you want a new version of it
          key: ${{ runner.os }}-assets-${{ hashFiles('apps/docs/scripts/assets.ts') }}
          restore-keys: |
            ${{ runner.os }}-assets-

      - name: Prepare building
        run: make build-prepare

      - name: Build
        env:
          CRISP_WEBSITE_ID: ${{ secrets.CRISP_WEBSITE_ID }}
        run: make build

      - name: Set up Docker buildx
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: docker/login-action@v2
        with:
          registry: ${{ env.CONTAINER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the application Docker image
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.CONTAINER_IMAGE_FOLDER }}/${{ env.APP_NAME }}-${{ github.ref_name }}:${{ github.sha }},${{ env.CONTAINER_IMAGE_FOLDER }}/${{ env.APP_NAME }}-${{ github.ref_name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to Coolify
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          curl --fail-with-body --request POST '${{ secrets.COOLIFY_CORE_WEBHOOK }}' --header 'Authorization: Bearer ${{ secrets.COOLIFY_CORE_TOKEN }}'

      - name: Release package
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        working-directory: packages/dsfr-connect
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: pnpx semantic-release@21.0.2
